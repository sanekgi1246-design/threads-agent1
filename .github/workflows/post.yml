name: Публикация поста

on:
  schedule:
    # время в UTC. 07:17 / 12:17 / 17:17 UTC = 09:17 / 14:17 / 19:17 по Киеву (зимнее время)
    - cron: "17 7 * * *"
    - cron: "17 12 * * *"
    - cron: "17 17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Только показать текст, не публиковать"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: agent-state
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Небольшая случайная пауза, чтобы посты не выходили минута в минуту
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 900))
      - name: Написать и опубликовать
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python post.py
      - name: Сохранить состояние
        if: always()
        run: |
          git config user.name "threads-agent"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "post: $(date -u +%F_%H%M)" && git pull --rebase && git push)
