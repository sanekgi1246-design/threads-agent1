name: Сбор метрик

on:
  schedule:
    - cron: "40 */3 * * *"   # каждые 3 часа
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-state
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Собрать метрики Threads и Telegram
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
        run: python metrics.py
      - name: Сохранить
        run: |
          git config user.name "threads-agent"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "metrics: $(date -u +%F_%H%M)" && git pull --rebase && git push)
