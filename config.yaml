# ===== Настройки агента. Меняй здесь, код трогать не нужно =====

language: ru
niche: "крипта простыми словами: биткоин, альткоины, безопасность, как не потерять деньги"
voice: >
  Пишешь как живой человек, ведущий крипто-подкаста: коротко, по делу, с лёгкой иронией.
  Без воды, без канцелярита, без «друзья, сегодня поговорим». Первая строка — крючок.
  1–2 эмодзи максимум. Без хэштегов (максимум один тематический в конце).

telegram:
  channel_url: "https://t.me/+CoppZpKhj91jMzVi"   # запасная ссылка, если бот не настроен
  cta_every: 3          # каждый N-й пост получает ответ-комментарий со ссылкой в TG
  cta_templates:
    - "Полный разбор + чек-лист закинул в телеграм 👇\n{link}"
    - "В телеге выкладываю то, что не помещается в 500 символов: {link}"
    - "Обсуждаем это в нашем TG, залетай: {link}"

posting:
  max_posts_per_day: 3
  max_chars: 480          # лимит Threads 500, оставляем запас
  similarity_threshold: 0.55   # если пост похож на недавний сильнее — переписываем

# Рубрики. Агент сам смещает частоту в сторону тех, что лучше заходят (по метрикам).
rubrics:
  market_pulse:
    title: "Пульс рынка"
    brief: "Короткая сводка по рынку на основе реальных цифр из контекста: что произошло и что это значит для обычного человека. Без прогнозов цены."
    needs_news: false
  news_explained:
    title: "Новость простыми словами"
    brief: "Возьми ОДНУ новость из списка и объясни, почему это важно и что делать/не делать обычному держателю крипты."
    needs_news: true
  scam_alert:
    title: "Осторожно, скам"
    brief: "Разбор одной схемы обмана в крипте (фишинг, фейковые аирдропы, поддельные кошельки, «помощь с выводом»). Как распознать."
    needs_news: false
  myth_buster:
    title: "Миф или правда"
    brief: "Возьми популярный миф о крипте и разбей его фактами."
    needs_news: false
  question:
    title: "Вопрос подписчикам"
    brief: "Провокационный, но честный вопрос аудитории, чтобы собрать ответы в комментариях. Коротко."
    needs_news: false
  basics:
    title: "Крипта за 30 секунд"
    brief: "Объясни один базовый термин (холодный кошелёк, сид-фраза, стейкинг, халвинг, газ и т.п.) на бытовом примере."
    needs_news: false

# Самообучение: доля «исследования» случайных рубрик (остальное — лучшие по вовлечённости)
learning:
  explore_rate: 0.3
  min_posts_per_rubric: 3

market:
  coins: [bitcoin, ethereum, solana, toncoin]

news_feeds:
  - https://forklog.com/feed
  - https://www.coindesk.com/arc/outboundfeeds/rss/
  - https://cointelegraph.com/rss

# Фразы, которые агент никогда не публикует (защита от «финсовета» и обещаний)
banned_phrases:
  - "гарантирован"
  - "100% прибыл"
  - "x100"
  - "иксы"
  - "срочно покупай"
  - "это не скам"
  - "пассивный доход без риска"
